<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarkar Mitra</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --bg-button: #ffffff;
            --border-color: #e2e8f0;
            --border-input: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --accent-green: #059669;
            --accent-green-dark: #047857;
            --accent-green-bg: #059669;

            --bot-msg-bg: transparent;
            --user-msg-bg: #f1f5f9;
            font-family: 'Inter', system-ui, Avenir, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            font-weight: 400;
            color-scheme: light;
            color: var(--text-primary);
            background-color: var(--bg-main);
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            margin-top: 15px;
            margin-bottom: 10px;
            color: var(--accent-green);
        }

        .markdown-body a {
            color: var(--accent-green);
            text-decoration: underline;
            text-decoration-thickness: 1.5px;
            text-underline-offset: 3px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .markdown-body a:hover {
            color: var(--accent-green-dark);
        }

        .assistant-msg-content h3 {
            margin-top: 10px;
            margin-bottom: 2px;
            font-size: 1rem;
            color: var(--accent-green);
        }

        .assistant-msg-content a {
            color: var(--accent-green);
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .assistant-msg-content a:hover {
            color: var(--accent-green-dark);
            text-decoration-thickness: 2px;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            margin-top: 15px;
            margin-bottom: 10px;
            color: var(--accent-green);
        }

        .markdown-body a {
            color: var(--accent-green);
            text-decoration: underline;
            text-decoration-thickness: 1.5px;
            text-underline-offset: 3px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .markdown-body a:hover {
            color: var(--accent-green-dark);
        }

        .assistant-msg-content h3 {
            margin-top: 10px;
            margin-bottom: 2px;
            font-size: 1rem;
            color: var(--accent-green);
        }

        .assistant-msg-content a {
            color: var(--accent-green);
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .assistant-msg-content a:hover {
            color: var(--accent-green-dark);
            text-decoration-thickness: 2px;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at 50% -20%, #ffffff 0%, #f1f5f9 40%);
        }

        #root {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        * {
            box-sizing: border-box;
        }

        .assistant-msg-content .styled-list {
            list-style: none;
            padding: 0;
            margin: 5px 0 10px 4px;
            counter-reset: md-list-roman;
        }

        .assistant-msg-content .styled-list li {
            position: relative;
            padding-left: 28px;
            margin-bottom: 6px;
            line-height: 1.55;
            color: var(--text-secondary);
            counter-increment: md-list-roman;
        }

        .assistant-msg-content .styled-list li::before {
            content: counter(md-list-roman, lower-roman) ") ";
            position: absolute;
            left: 0;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* Custom styles for paragraphs rendered as list items */
        .assistant-list-item {
            display: flex;
            gap: 8px;
            margin: 0 0 2px 0;
            line-height: 1.55;
            padding-left: 4px;
            counter-increment: section-roman;
        }

        .roman-marker {
            flex-shrink: 0;
            min-width: 24px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .roman-marker::before {
            content: counter(section-roman, lower-roman) ") ";
        }

        .assistant-header {
            counter-reset: section-roman;
            display: block;
            margin-top: 4px;
            margin-bottom: 2px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .assistant-header:first-child {
            margin-top: 4px;
        }

        .assistant-description {
            display: block;
            margin-bottom: 4px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Hide scrollbars globally but keep functionality */
        .messages-container::-webkit-scrollbar,
        .chat-input::-webkit-scrollbar,
        .eligibility-modal-content::-webkit-scrollbar {
            display: none;
        }

        .messages-container,
        .chat-input,
        .eligibility-modal-content {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .styled-list {
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .styled-list li {
            margin-bottom: 6px;
        }



        .assistant-msg-content a::after {
            content: " ↗";
            font-size: 0.75em;
        }

        .app-container {
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background-color: transparent;
        }

        .main-chat {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }

        .messages-container {
            flex: 1 1 auto;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            gap: 30px;
            width: 100%;
        }

        .welcome-card-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            font-size: 1.2rem;
        }

        .avatar.bot {
            background: linear-gradient(135deg, #065f46, #10b981);
            color: white;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .avatar.user {
            background-color: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .welcome-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            color: var(--text-secondary);
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .welcome-card h3 {
            color: var(--accent-green);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .welcome-card p {
            margin-bottom: 15px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .welcome-card p:last-child {
            margin-bottom: 0;
        }

        .highlight-text {
            color: var(--accent-green);
            font-weight: 500;
        }

        .suggestions-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .suggestion-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .suggestion-btn:hover {
            background-color: var(--bg-card);
            border-color: #64748b;
            transform: translateY(-2px);
        }

        .suggestion-btn span {
            font-size: 1.1rem;
        }

        .message-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
        }

        .message-bubble {
            font-size: 1rem;
            line-height: 1.6;
            max-width: 85%;
            position: relative;
        }

        .message-bubble.bot {
            background-color: transparent;
            color: var(--text-secondary);
        }

        .message-bubble.user {
            background-color: var(--user-msg-bg);
            color: var(--text-primary);
            padding: 15px 20px;
            border-radius: 16px;
            border-top-right-radius: 4px;
        }

        .input-container {
            padding: 0 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reset-chat-btn {
            background: transparent;
            border: none;
            color: #6366f1;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px 12px;
            transition: all 0.2s;
            font-weight: 500;
            opacity: 0.8;
        }

        .reset-chat-btn:hover {
            opacity: 1;
            transform: scale(1.02);
            color: #4f46e5;
        }

        .input-box {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .input-box:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            padding: 6px 10px; /* Reduced padding */
            max-height: 200px;
            min-height: 32px; /* Reduced min-height */
            outline: none;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            width: 40px; /* Reduced width */
            height: 40px; /* Reduced height */
            border-radius: 14px; /* Reduced border-radius */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            flex-shrink: 0;
            margin-bottom: 0px; /* Reduced margin-bottom */
        }

        .action-btn.send {
            background-color: var(--accent-green-bg);
            color: white;
        }

        .action-btn.send:hover:not(:disabled) {
            background-color: var(--accent-green-dark);
            transform: scale(1.05);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #e2e8f0;
        }

        .upload-input-hidden {
            display: none;
        }

        .disclaimer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 5px;
        }

        .disclaimer .info-icon {
            background-color: #3b82f6;
            color: white;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
        }

        .sarkar-mitra-text {
            color: var(--accent-green);
        }

        /* Loader */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 5px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-green);
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .eligibility-modal {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 90% !important;
            max-width: 550px !important;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .close-modal-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: var(--text-primary);
        }

        .eligibility-modal h2 {
            margin: 0;
            color: var(--accent-green);
            font-size: 1.5rem;
            text-align: left;
        }

        .stepper {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            text-align: left;
        }

        .step-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 150px;
            justify-content: center;
        }

        .step-content label {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 500;
            display: block;
            text-align: left;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent-green);
        }

        .form-input.select {
            appearance: none;
            cursor: pointer;
        }

        .age-group-info {
            font-size: 0.9rem;
            color: var(--accent-green);
            font-weight: 500;
            margin-top: -5px;
            text-align: left;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .button-group.wrap {
            flex-wrap: wrap;
        }

        .option-btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .button-group.wrap .option-btn {
            flex: 0 1 auto;
        }

        .option-btn:hover {
            background-color: #f8fafc;
            color: var(--text-primary);
        }

        .option-btn.active {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            margin: 0;
        }

        .modal-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-btn.secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-btn.secondary:hover {
            background-color: var(--bg-input);
        }

        .modal-btn.primary {
            background-color: var(--accent-green-bg);
            color: white;
            min-width: 100px;
        }

        .modal-btn.primary:hover:not(:disabled) {
            background-color: var(--accent-green-dark);
            transform: scale(1.05);
        }

        .modal-btn.primary.finish {
            width: 100%;
        }

        @media (max-width: 768px) {
            .suggestions-grid {
                padding: 0 10px;
            }

            .suggestion-btn {
                font-size: 0.85rem;
                padding: 8px 12px;
            }
        }

        /* =============================================
           WIDGET / CHATBOT EMBED MODE
           ============================================= */
        .widget-bubble {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
            z-index: 9999;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: bubble-pulse 2.5s infinite;
        }

        .widget-bubble:hover {
            transform: scale(1.1);
        }

        @keyframes bubble-pulse {

            0%,
            100% {
                box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
            }

            50% {
                box-shadow: 0 6px 30px rgba(5, 150, 105, 0.7);
            }
        }

        .widget-panel {
            position: fixed;
            bottom: 96px;
            right: 24px;
            width: 480px;
            height: 640px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 9998;
            transition: height 0.25s ease;
        }

        .widget-panel.minimized {
            height: 56px;
        }

        .widget-panel.maximized {
            bottom: 0;
            right: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
        }

        .widget-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .widget-header-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #059669, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .widget-header-title {
            display: flex;
            flex-direction: column;
        }

        .widget-header-title .wt-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .widget-header-title .wt-status {
            font-size: 0.72rem;
            color: #22c55e;
        }

        .widget-header-controls {
            display: flex;
            gap: 5px;
        }

        .widget-ctrl-btn {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .widget-ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .widget-ctrl-btn.close:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        /* ==============================================
           WIDGET: AGGRESSIVE TEXT WRAP FIX
           ============================================== */

        /* Root-level overflow lock on the panel */
        .widget-panel,
        .widget-panel * {
            max-width: 100%;
            box-sizing: border-box;
        }

        /* Main chat layout inside widget */
        .widget-panel .main-chat {
            max-width: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* Messages container - no horizontal scroll */
        .widget-panel .messages-container {
            overflow-x: hidden !important;
            overflow-y: auto;
            padding: 14px 12px 10px 12px;
            gap: 18px;
            width: 100%;
        }

        /* Message wrapper fills full width */
        .widget-panel .message-wrapper {
            width: 100%;
        }

        /* Message bubble: wrap all text, no overflow */
        .widget-panel .message-bubble {
            max-width: 94%;
            min-width: 0;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            overflow: hidden;
        }

        /* All text content inside assistant bubble */
        .widget-panel .assistant-msg-content,
        .widget-panel .assistant-msg-content p,
        .widget-panel .assistant-msg-content span,
        .widget-panel .assistant-msg-content li,
        .widget-panel .assistant-msg-content td,
        .widget-panel .assistant-msg-content th,
        .widget-panel .assistant-msg-content blockquote {
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            overflow-x: hidden !important;
            max-width: 100%;
        }

        /* Code blocks inside widget — force wrap */
        .widget-panel pre,
        .widget-panel code {
            white-space: pre-wrap !important;
